services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  vectorview:
    build:
      context: .
      args:
        INSTALL_EXTRAS: ""
    restart: unless-stopped
    ports:
      - "7433:7433"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      VECTORVIEW_PORT: "7433"
      VECTORVIEW_CACHE_DIR: /app/.cache/projections
      VECTORVIEW_META_BRIDGE_LIVE: "false"
      VECTORVIEW_FRONTPOCKET_LIVE: "false"
      VECTORVIEW_TOKEN: ""
    depends_on:
      - qdrant
    volumes:
      - projection_cache:/app/.cache/projections

volumes:
  qdrant_storage:
  projection_cache:
